<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шахматная Академия — 50 Дебютов</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121110; color: #f0e6d2; padding: 15px; }
    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { color: #e6c687; font-size: 1.8rem; margin-bottom: 5px; }
    header p { color: #a89f91; font-size: 0.95rem; }
    .search-box { width: 100%; padding: 12px 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #544738; background: #1c1916; color: #fff; font-size: 1rem; outline: none; }
    .search-box:focus { border-color: #c5a059; }
    .stats { margin-bottom: 15px; color: #c5a059; font-size: 0.9rem; text-align: right; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
    .card { background: #1c1916; border: 1px solid #3d352b; border-radius: 8px; padding: 12px; cursor: pointer; transition: transform 0.1s, border-color 0.1s; }
    .card:active { transform: scale(0.98); }
    .card-num { font-size: 0.75rem; color: #888; margin-bottom: 4px; }
    .card-title { color: #e6c687; font-size: 1rem; font-weight: bold; margin-bottom: 6px; }
    .card-moves { font-family: monospace; color: #c5a059; font-size: 0.85rem; word-break: break-word; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 15px; z-index: 1000; }
    .modal-content { background: #1c1916; padding: 20px; border-radius: 10px; border: 1px solid #c5a059; max-width: 420px; width: 100%; position: relative; text-align: center; }
    .close-btn { position: absolute; top: 8px; right: 15px; font-size: 1.8rem; color: #a89f91; cursor: pointer; }
    .m-title { color: #e6c687; margin-bottom: 6px; text-align: left; padding-right: 20px; }
    .m-moves { background: #11100f; padding: 8px 12px; border-radius: 6px; color: #c5a059; font-family: monospace; font-size: 0.9rem; border: 1px solid #3d352b; text-align: left; margin-bottom: 15px; }
    #board { width: 100%; max-width: 320px; margin: 0 auto 15px auto; border: 2px solid #544738; }
    .controls { display: flex; gap: 8px; justify-content: center; }
    .btn-ctrl { background: #2b2621; color: #f0e6d2; border: 1px solid #544738; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    .btn-ctrl:active { background: #c5a059; color: #121110; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Шахматная Академия</h1>
      <p>50 интерактивных шахматных дебютов со звуком</p>
    </header>
    <input type="text" id="search" class="search-box" placeholder="🔍 Поиск дебюта..." oninput="filterOpenings()">
    <div class="stats" id="count-info">Найдено: 50</div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 id="m-title" class="m-title"></h2>
      <div id="m-moves" class="m-moves"></div>
      <div id="board"></div>
      <div class="controls">
        <button class="btn-ctrl" onclick="prevMove()">◄ Назад</button>
        <button class="btn-ctrl" onclick="togglePlay()" id="play-btn">▶ Авто</button>
        <button class="btn-ctrl" onclick="nextMove()">Вперёд ►</button>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

  <script>
    const database = [
      { id: 1, title: "Итальянская партия", moves: ["e4", "e5", "Nf3", "Nc6", "Bc4"], pgn: "1. e4 e5 2. Nf3 Nc6 3. Bc4" },
      { id: 2, title: "Испанская партия", moves: ["e4", "e5", "Nf3", "Nc6", "Bb5"], pgn: "1. e4 e5 2. Nf3 Nc6 3. Bb5" },
      { id: 3, title: "Шотландская партия", moves: ["e4", "e5", "Nf3", "Nc6", "d4"], pgn: "1. e4 e5 2. Nf3 Nc6 3. d4" },
      { id: 4, title: "Защита Петрова", moves: ["e4", "e5", "Nf3", "Nf6"], pgn: "1. e4 e5 2. Nf3 Nf6" },
      { id: 5, title: "Защита Филидора", moves: ["e4", "e5", "Nf3", "d6"], pgn: "1. e4 e5 2. Nf3 d6" },
      { id: 6, title: "Защита двух коней", moves: ["e4", "e5", "Nf3", "Nc6", "Bc4", "Nf6"], pgn: "1. e4 e5 2. Nf3 Nc6 3. Bc4 Nf6" },
      { id: 7, title: "Дебют четырех коней", moves: ["e4", "e5", "Nf3", "Nc6", "Nc3", "Nf6"], pgn: "1. e4 e5 2. Nf3 Nc6 3. Nc3 Nf6" },
      { id: 8, title: "Королевский гамбит", moves: ["e4", "e5", "f4"], pgn: "1. e4 e5 2. f4" },
      { id: 9, title: "Гамбит Эванса", moves: ["e4", "e5", "Nf3", "Nc6", "Bc4", "Bc5", "b4"], pgn: "1. e4 e5 2. Nf3 Nc6 3. Bc4 Bc5 4. b4" },
      { id: 10, title: "Детский мат", moves: ["e4", "e5", "Qh5", "Nc6", "Bc4", "Nf6", "Qxf7#"], pgn: "1. e4 e5 2. Qh5 Nc6 3. Bc4 Nf6 4. Qxf7#" },
      { id: 11, title: "Венская партия", moves: ["e4", "e5", "Nc3"], pgn: "1. e4 e5 2. Nc3" },
      { id: 12, title: "Центральный дебют", moves: ["e4", "e5", "d4", "exd4", "Qxd4"], pgn: "1. e4 e5 2. d4 exd4 3. Qxd4" },
      { id: 13, title: "Сицилианская защита", moves: ["e4", "c5"], pgn: "1. e4 c5" },
      { id: 14, title: "Французская защита", moves: ["e4", "e6", "d4", "d5"], pgn: "1. e4 e6 2. d4 d5" },
      { id: 15, title: "Защита Каро-Канн", moves: ["e4", "c6", "d4", "d5"], pgn: "1. e4 c6 2. d4 d5" },
      { id: 16, title: "Защита Пирца-Уфимцева", moves: ["e4", "d6", "d4", "Nf6", "Nc3", "g6"], pgn: "1. e4 d6 2. d4 Nf6 3. Nc3 g6" },
      { id: 17, title: "Скандинавская защита", moves: ["e4", "d5"], pgn: "1. e4 d5" },
      { id: 18, title: "Защита Алехина", moves: ["e4", "Nf6"], pgn: "1. e4 Nf6" },
      { id: 19, title: "Защита Нимцовича", moves: ["e4", "Nc6"], pgn: "1. e4 Nc6" },
      { id: 20, title: "Сицилианская: Вариант Дракона", moves: ["e4", "c5", "Nf3", "d6", "d4", "cxd4", "Nxd4", "Nf6", "Nc3", "g6"], pgn: "1. e4 c5 2. Nf3 d6 3. d4 cxd4 4. Nxd4 Nf6 5. Nc3 g6" },
      { id: 21, title: "Сицилианская: Вариант Найдорфа", moves: ["e4", "c5", "Nf3", "d6", "d4", "cxd4", "Nxd4", "Nf6", "Nc3", "a6"], pgn: "1. e4 c5 2. Nf3 d6 3. d4 cxd4 4. Nxd4 Nf6 5. Nc3 a6" },
      { id: 22, title: "Сицилианская: Челябинский вариант", moves: ["e4", "c5", "Nf3", "Nc6", "d4", "cxd4", "Nxd4", "Nf6", "Nc3", "e5"], pgn: "1. e4 c5 2. Nf3 Nc6 3. d4 cxd4 4. Nxd4 Nf6 5. Nc3 e5" },
      { id: 23, title: "Ферзевый гамбит", moves: ["d4", "d5", "c4"], pgn: "1. d4 d5 2. c4" },
      { id: 24, title: "Принятый ферзевый гамбит", moves: ["d4", "d5", "c4", "dxc4"], pgn: "1. d4 d5 2. c4 dxc4" },
      { id: 25, title: "Отказанный ферзевый гамбит", moves: ["d4", "d5", "c4", "e6"], pgn: "1. d4 d5 2. c4 e6" },
      { id: 26, title: "Славянская защита", moves: ["d4", "d5", "c4", "c6"], pgn: "1. d4 d5 2. c4 c6" },
      { id: 27, title: "Лондонская система", moves: ["d4", "d5", "Nf3", "Nf6", "Bf4"], pgn: "1. d4 d5 2. Nf3 Nf6 3. Bf4" },
      { id: 28, title: "Дебют Тромповского", moves: ["d4", "Nf6", "Bg5"], pgn: "1. d4 Nf6 2. Bg5" },
      { id: 29, title: "Система Колле", moves: ["d4", "d5", "Nf3", "Nf6", "e3"], pgn: "1. d4 d5 2. Nf3 Nf6 3. e3" },
      { id: 30, title: "Гамбит Альбина", moves: ["d4", "d5", "c4", "e5"], pgn: "1. d4 d5 2. c4 e5" },
      { id: 31, title: "Староиндийская защита", moves: ["d4", "Nf6", "c4", "g6", "Nc3", "Bg7"], pgn: "1. d4 Nf6 2. c4 g6 3. Nc3 Bg7" },
      { id: 32, title: "Защита Нимцовича", moves: ["d4", "Nf6", "c4", "e6", "Nc3", "Bb4"], pgn: "1. d4 Nf6 2. c4 e6 3. Nc3 Bb4" },
      { id: 33, title: "Новоиндийская защита", moves: ["d4", "Nf6", "c4", "e6", "Nf3", "b6"], pgn: "1. d4 Nf6 2. c4 e6 3. Nf3 b6" },
      { id: 34, title: "Защита Грюнфельда", moves: ["d4", "Nf6", "c4", "g6", "Nc3", "d5"], pgn: "1. d4 Nf6 2. c4 g6 3. Nc3 d5" },
      { id: 35, title: "Защита Бенони", moves: ["d4", "Nf6", "c4", "c5", "d5"], pgn: "1. d4 Nf6 2. c4 c5 3. d5" },
      { id: 36, title: "Волжский гамбит (Бенко)", moves: ["d4", "Nf6", "c4", "c5", "d5", "b5"], pgn: "1. d4 Nf6 2. c4 c5 3. d5 b5" },
      { id: 37, title: "Голландская защита", moves: ["d4", "f5"], pgn: "1. d4 f5" },
      { id: 38, title: "Будапештский гамбит", moves: ["d4", "Nf6", "c4", "e5"], pgn: "1. d4 Nf6 2. c4 e5" },
      { id: 39, title: "Английское начало", moves: ["c4"], pgn: "1. c4" },
      { id: 40, title: "Дебют Рети", moves: ["Nf3", "d5", "c4"], pgn: "1. Nf3 d5 2. c4" },
      { id: 41, title: "Староиндийское начало", moves: ["Nf3", "d5", "g3", "Nf6", "Bg2"], pgn: "1. Nf3 d5 2. g3 Nf6 3. Bg2" },
      { id: 42, title: "Дебют Бёрда", moves: ["f4"], pgn: "1. f4" },
      { id: 43, title: "Дебют Ларсена", moves: ["b3"], pgn: "1. b3" },
      { id: 44, title: "Дебют Сокольского", moves: ["b4"], pgn: "1. b4" },
      { id: 45, title: "Дебют Гроба", moves: ["g4"], pgn: "1. g4" },
      { id: 46, title: "Северный (Датский) гамбит", moves: ["e4", "e5", "d4", "exd4", "c3"], pgn: "1. e4 e5 2. d4 exd4 3. c3" },
      { id: 47, title: "Шотландский гамбит", moves: ["e4", "e5", "Nf3", "Nc6", "d4", "exd4", "Bc4"], pgn: "1. e4 e5 2. Nf3 Nc6 3. d4 exd4 4. Bc4" },
      { id: 48, title: "Гамбит Блэкмар-Димера", moves: ["d4", "d5", "e4", "dxe4", "Nc3"], pgn: "1. d4 d5 2. e4 dxe4 3. Nc3" },
      { id: 49, title: "Гамбит Хэллоуин", moves: ["e4", "e5", "Nf3", "Nc6", "Nc3", "Nf6", "Nxe5"], pgn: "1. e4 e5 2. Nf3 Nc6 3. Nc3 Nf6 4. Nxe5" },
      { id: 50, title: "Защита Святого Георгия", moves: ["e4", "a6"], pgn: "1. e4 a6" }
    ];

    let board = null;
    let game = new Chess();
    let currentMoves = [];
    let moveIdx = 0;
    let autoPlayTimer = null;

    function playMoveSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch(e) {}
    }

    function render(items) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      document.getElementById('count-info').textContent = `Найдено: ${items.length}`;

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModal(item);
        card.innerHTML = `
          <div class="card-num">#${item.id}</div>
          <div class="card-title">${item.title}</div>
          <div class="card-moves">${item.pgn}</div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(item) {
      document.getElementById('m-title').textContent = `#${item.id} ${item.title}`;
      document.getElementById('m-moves').textContent = item.pgn;
      document.getElementById('modal').style.display = 'flex';

      game.reset();
      currentMoves = item.moves;
      moveIdx = 0;

      if (!board) {
        board = Chessboard('board', {
          position: 'start',
          pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });
      } else {
        board.position('start');
      }
    }

    function nextMove() {
      if (moveIdx < currentMoves.length) {
        game.move(currentMoves[moveIdx]);
        board.position(game.fen());
        moveIdx++;
        playMoveSound();
      } else {
        stopAutoPlay();
      }
    }

    function prevMove() {
      if (moveIdx > 0) {
        game.undo();
        board.position(game.fen());
        moveIdx--;
        playMoveSound();
      }
    }

    function togglePlay() {
      if (autoPlayTimer) {
        stopAutoPlay();
      } else {
        document.getElementById('play-btn').textContent = '⏸ Пауза';
        autoPlayTimer = setInterval(() => {
          if (moveIdx < currentMoves.length) {
            nextMove();
          } else {
            stopAutoPlay();
          }
        }, 800);
      }
    }

    function stopAutoPlay() {
      clearInterval(autoPlayTimer);
      autoPlayTimer = null;
      document.getElementById('play-btn').textContent = '▶ Авто';
    }

    function closeModal() {
      stopAutoPlay();
      document.getElementById('modal').style.display = 'none';
    }

    function filterOpenings() {
      const q = document.getElementById('search').value.toLowerCase();
      render(database.filter(i => i.title.toLowerCase().includes(q) || i.pgn.toLowerCase().includes(q)));
    }

    render(database);
  </script>
</body>
</html>
